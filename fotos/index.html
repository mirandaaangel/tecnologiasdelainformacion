<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaroid Studio Pro - Multi-página</title>
    <style>
        :root {
            --paper-width: 215.9mm;
            --paper-height: 279.4mm;
            --margin-hoja: 10mm;
            --polaroid-bg: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #374151;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- INTERFAZ DE USUARIO --- */
        .ui-header {
            background: #ffffff;
            color: #111827;
            width: 100%;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-print { background: #2563eb; color: white; }
        .btn-clear { background: #ef4444; color: white; }

        /* --- CONTENEDOR DE PÁGINAS --- */
        #pagesContainer {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 0;
        }

        /* DISEÑO DE LA HOJA (CARTA) */
        .paper {
            width: var(--paper-width);
            height: var(--paper-height);
            background: white;
            padding: var(--margin-hoja);
            display: block;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            page-break-after: always; /* Importante para impresión multi-página */
        }

        /* Grid Forzado 3x3 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6mm; 
            width: 100%;
            height: 100%;
        }

        /* Estilo Polaroid */
        .polaroid {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 8px 8px 28px 8px; /* Espacio inferior característico */
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #f9fafb;
        }

        /* --- AJUSTES DE IMPRESIÓN --- */
        @media print {
            body { background: white; margin: 0; }
            .ui-header { display: none; }
            #pagesContainer { gap: 0; padding: 0; }
            .paper {
                margin: 0;
                box-shadow: none;
                border: none;
            }
            @page {
                size: letter;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <header class="ui-header">
        <h1>📸 Polaroid Print Studio Pro</h1>
        <p>Sube todas las fotos que quieras. Se organizarán en hojas de 9 fotos automáticamente.</p>
        <div class="controls">
            <input type="file" id="imageInput" accept="image/*" multiple aria-label="Añadir fotos">
            <button class="btn btn-print" onclick="window.print()">🖨️ Imprimir todas las hojas</button>
            <button class="btn btn-clear" onclick="clearAll()">🗑️ Borrar todo</button>
        </div>
    </header>

    <div id="pagesContainer">
        </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const pagesContainer = document.getElementById('pagesContainer');

        imageInput.addEventListener('change', async function() {
            const files = Array.from(this.files);
            if (files.length === 0) return;

            // Procesamos las imágenes en grupos de 9
            for (let i = 0; i < files.length; i += 9) {
                const chunk = files.slice(i, i + 9);
                await createPage(chunk);
            }
            
            // Limpiamos el input para permitir subir las mismas fotos si se desea
            imageInput.value = '';
        });

        async function createPage(images) {
            // Creamos una nueva "Hoja Carta"
            const paper = document.createElement('div');
            paper.className = 'paper';
            
            const grid = document.createElement('div');
            grid.className = 'grid-container';
            
            // Llenamos la hoja con las imágenes del grupo (máximo 9)
            const promises = images.map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const polaroid = document.createElement('div');
                        polaroid.className = 'polaroid';
                        
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        
                        polaroid.appendChild(img);
                        resolve(polaroid);
                    };
                    reader.readAsDataURL(file);
                });
            });

            const polaroids = await Promise.all(promises);
            polaroids.forEach(p => grid.appendChild(p));
            
            paper.appendChild(grid);
            pagesContainer.appendChild(paper);
        }

        function clearAll() {
            if (confirm('¿Deseas borrar todas las hojas generadas?')) {
                pagesContainer.innerHTML = '';
                imageInput.value = '';
            }
        }
    </script>
</body>
</html>
